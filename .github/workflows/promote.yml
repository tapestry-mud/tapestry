name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to :latest (e.g., 0.0.5)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tapestry-mud/tapestry

jobs:
  promote-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver (e.g. 0.0.5), got: ${{ inputs.version }}"
            exit 1
          fi
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"
          TARGET="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Promoted $SOURCE -> $TARGET"

      - name: Register stable channel
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_tag\":\"${{ inputs.version }}\",\"version\":\"${{ inputs.version }}\"}" \
            https://registry.tapestryengine.com/v1/admin/engine-channels/stable

      - name: Trigger engine deploy
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_DEPLOY_TOKEN }}" \
            https://api.github.com/repos/tapestry-mud/tapestry-infra/actions/workflows/engine-deploy.yml/dispatches \
            -d "{\"ref\":\"master\",\"inputs\":{\"version\":\"${{ inputs.version }}\",\"game_path\":\"/opt/tapestry/legends-forgotten\"}}"

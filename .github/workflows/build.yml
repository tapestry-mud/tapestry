name: Build

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tapestry-mud/tapestry

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}

      - name: Compute ENGINE_VERSION
        id: engine-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ENGINE_VERSION=${{ steps.engine-version.outputs.value }}

      - name: Register nightly channel
        if: github.ref == 'refs/heads/master'
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"docker_tag":"edge","version":"edge"}' \
            https://registry.tapestryengine.com/v1/admin/engine-channels/nightly

      - name: Register version channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_tag\":\"$VERSION\",\"version\":\"$VERSION\"}" \
            "https://registry.tapestryengine.com/v1/admin/engine-channels/$VERSION"

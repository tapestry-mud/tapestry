name: "@tapestry/example-pack"
version: "0.0.2"
type: world
display_name: "Example Pack"
description: "A starter demo pack: warrior and mage classes, human and elf races, starter town, and character creation. Copy-paste starting point for pack authors."
author: "Tapestry"
license: "AGPL-3.0"
engine: ">=0.0.1"
tag_validation: strict
active: true
load_order: 10

content:
  area_definitions: "areas/**/area.yaml"
  rooms: "areas/**/rooms/*.yaml"
  items: "areas/**/items/*.yaml"
  mobs: "areas/**/mobs/*.yaml"
  scripts: "scripts/**/*.js"
  help: "help/**/*.yaml"

# server.test.yaml — test configuration; extends production packs with test overrides
server:
  name: "Tapestry Dev Server"
  motd: "\r\n<highlight>===================================================</highlight>\r\n\r\n  <danger>T</danger><item.artifact>A</item.artifact><player>P</player><item.rare>E</item.rare><npc>S</npc><danger>T</danger><item.artifact>R</item.artifact><player>Y</player>   <subtle>v2.0 - Phase 2</subtle>\r\n\r\n  <npc>New in this build:</npc>\r\n    <direction>*</direction> <highlight>Stats & Score</highlight> - check your abilities with <direction>score</direction>\r\n    <direction>*</direction> <highlight>Equipment</highlight> - <direction>get</direction>, <direction>wear</direction>, <direction>wield</direction>, <direction>remove</direction> items\r\n    <direction>*</direction> <highlight>Inventory</highlight> - manage your gear with <direction>inventory</direction>\r\n    <direction>*</direction> <highlight>Color Themes</highlight> - the world is alive with color\r\n\r\n  <subtle>Type</subtle> <direction>help</direction> <subtle>for commands,</subtle> <direction>look</direction> <subtle>to see the world.</subtle>\r\n\r\n<highlight>===================================================</highlight>\r\n"
  telnet_port: 4000
  websocket_port: 4001
  max_connections: 200
  tick_rate_ms: 100

packs:
  - tapestry-core
  - tapestry-biomes
  - tapestry-cooking
  - tapestry-builder
  - tapestry-oracle
  - example-pack
  # Seed accounts + test arena live in tests/fixtures/scenario-packs (engine
  # repo, never published); the runner stages it into the managed corpus.
  - test-fixtures

llm:
  provider: none

logging:
  level: Information

telemetry:
  enabled: true
  endpoint: "http://localhost:4317"
  protocol: grpc
  service_name: tapestry
  console:
    enabled: true
    format: text
  admin_channel:
    slow_tick_threshold_ms: 50
    tag: admin

# Link-dead reconnect is a production affordance and a test-isolation hazard.
# The scenario runner ends a scenario by closing its sockets; an abrupt close is
# not an intentional quit, so with link-dead ON the engine parks the session and
# keeps the character entity live in the world for link_dead.timeout_seconds.
# The next scenario file logging in under the same name then RECONNECTS to that
# entity instead of loading the save, inheriting everything the previous file
# did to it. The runner quits cleanly where it can, but a scenario that ends
# inside an interactive flow has its `quit` swallowed by the flow, so the
# guarantee has to come from the server side: with this off, every disconnect —
# clean or abrupt — is a full teardown that saves and unloads the character.
# No scenario exercises link-dead reconnect; production config is unaffected.
link_dead:
  enabled: false

persistence:
  save_path: "./data/saves"
  autosave_interval: 3000
  password_min_length: 6
  max_login_attempts: 5

networking:
  negotiation_timeout_ms: 500

training:
  require_safe_room_for_stats: false
  trainable_stats: [strength, intelligence, wisdom, dexterity, constitution, luck]
  catch_up_boost: 5

economy:
  shop_buy_markup: 1.2
  shop_sell_discount: 0.5

# Scenarios are end-to-end coverage for what unit and functional tests cannot reach, so
# they must be 100% reproducible. Wander is not: it moves a mob on an unseeded roll to a
# randomly chosen exit, so a mob can leave between the command that finds it and the
# command that acts on it. That made a different scenario fail almost every run --
# `kill tandoor` after `tandoor beast leaves north`, an hp assert on a mob already gone.
# The `no_wander` room tag cannot substitute: it gates the destination, so it stops mobs
# entering a room and never stops the occupant leaving.
#
# A mob that should never move in the first place has `behavior: stationary` already; this
# switch is for the mobs a scenario does not author -- oracle-minted trash it walks up to
# and has to act on across several commands.
mob_ai:
  movement_enabled: false

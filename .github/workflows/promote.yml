name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to :latest (e.g., 0.0.5)'
        required: true
        type: string

permissions:
  contents: write   # create GitHub Releases at promote time (fires the GitHub->Discord #announcements webhook)
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tapestry-mud/tapestry

jobs:
  promote-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver (e.g. 0.0.5), got: ${{ inputs.version }}"
            exit 1
          fi
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"
          TARGET="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Promoted $SOURCE -> $TARGET"

      - name: Register stable channel
        run: |
          OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.tapestryengine.com" | jq -r '.value')
          curl -sf -X PATCH \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"docker_tag\":\"${{ inputs.version }}\",\"version\":\"${{ inputs.version }}\"}" \
            https://registry.tapestryengine.com/v1/admin/engine-channels/stable

      - name: Announce release on Discord (via GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Promotion is the moment a version becomes real. Creating a GitHub Release
          # for the existing v<version> tag fires the GitHub->Discord webhook (hook
          # 639452136, 'release' events) which posts to #announcements. Our flow only
          # pushes tags, so without this no Release event ever fires.
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- skipping (idempotent re-promote / rollback)."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --generate-notes --verify-tag
            echo "Created GitHub Release $TAG."
          fi

      - name: Mint deploy token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: tapestry-mud
          repositories: tapestry-infra

      - name: Trigger engine deploy
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/tapestry-mud/tapestry-infra/actions/workflows/engine-deploy.yml/dispatches \
            -d "{\"ref\":\"master\",\"inputs\":{\"version\":\"${{ inputs.version }}\",\"game_path\":\"/opt/tapestry/legends-forgotten\"}}"

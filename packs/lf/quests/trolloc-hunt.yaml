id: "lf:trolloc-hunt"
name: "Prove Your Worth"
type: main
giver: "lf:wisdom-moiraine"
repeatable: false
abandonable: false
prereqs:
  min_level: 1
  class: "lf:villager"
stages:
  - id: "hunt"
    description: "Slay the Trollocs threatening Emond's Field."
    objectives:
      - id: "kill-trollocs"
        type: kill
        target: "lf:trolloc"
        count: 10
        description: "Kill 10 Trollocs"
  - id: "return"
    description: "Return to Moiraine for your reward."
    objectives:
      - id: "visit-inn"
        type: visit
        target: "lf:room-village-inn"
        count: 1
        description: "Return to the inn"
rewards:
  xp: 200
  gold: 0
  items:
    - "lf:emond-field-key"
